<!-- The Footer -->

<footer
  aria-label="Site Info"
  class="d-flex flex-column justify-content-center align-items-center text-center text-muted py-3"
>
  <p class="footer-legal mb-2" style="font-size: 0.85rem; letter-spacing: 0.02em;">
    <a href="{{ '/about/' | relative_url }}" style="margin: 0 0.45rem;">About</a>&middot;<a href="{{ '/editorial-policy/' | relative_url }}" style="margin: 0 0.45rem;">Editorial Policy</a>&middot;<a href="{{ '/affiliate-disclosure/' | relative_url }}" style="margin: 0 0.45rem;">Affiliate Disclosure</a>&middot;<a href="{{ '/privacy/' | relative_url }}" style="margin: 0 0.45rem;">Privacy Policy</a>&middot;<a href="{{ '/terms/' | relative_url }}" style="margin: 0 0.45rem;">Terms</a>&middot;<a href="{{ '/contact/' | relative_url }}" style="margin: 0 0.45rem;">Contact</a>&middot;<a href="{{ '/feedback/' | relative_url }}" style="margin: 0 0.45rem;">Feedback</a>
  </p>

  <p class="mb-0">
    {{- '©' }}
    <time>{{ 'now' | date: '%Y' }}</time>
    {% if site.social.links %}
      <a href="{{ site.social.links[0] }}">{{ site.social.name }}</a>.
    {% else %}
      <em class="fst-normal">{{ site.social.name }}</em>.
    {% endif %}
    All rights reserved.
  </p>
</footer>
