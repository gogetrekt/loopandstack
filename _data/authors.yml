daniel:
  name: Daniel Reyes
  role: AI Tools and Software Editor
  bio: Covers AI assistants and the everyday software people work in. Compares plans line by line, so the limits buried in pricing pages are clear before you pay.
priya:
  name: Priya Nair
  role: Developer Tools and Cloud Editor
  bio: Covers editors, terminals, CI, hosting, and cloud platforms. Every tutorial is run end to end on a clean setup before it is published, with the failures left in.
tomas:
  name: Tomas Silva
  role: Security Tools and Privacy Editor
  bio: Covers VPNs, password managers, encryption, and privacy software. Tests marketing claims against what the product actually does.
elena:
  name: Elena Petrova
  role: Hardware and Networking Editor
  bio: Covers PC hardware, components, peripherals, and home networking: routers, Wi-Fi, and NAS boxes. Benchmarks every pick and checks street prices, so a recommendation still holds up at checkout.
marcus:
  name: Marcus Lee
  role: Mobile and Apps Editor
  bio: Covers Android, iOS, and the apps people live in. Follows the changelogs, and flags the settings and permissions that are worth changing on your own phone.
jonas:
  name: Jonas Weber
  role: Linux, Open Source, and Self-Hosting Editor
  bio: Covers Linux distributions, open source software, and self-hosting. Installs and configures everything from scratch for each guide, then writes down the steps that actually worked.
